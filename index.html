<!DOCTYPE html>
<html>
<head>
    <title>My Private Browser VM</title>
    <!-- Fix: Uses a public CDN that browsers are allowed to load -->
    <script src="https://cloudflare.com"></script>
</head>
<body style="background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <!-- The container canvas for the operating system output -->
    <div id="screen_container" style="white-space: pre; font-family: monospace; color: white;"></div>

    <script>
        var emulator = new V86Starter({
            // Fix: Pulls the corresponding WASM file safely
            wasm_path: "https://cloudflare.com",
            memory_size: 32 * 1024 * 1024, // 32MB for standard test Linux
            vga_memory_size: 2 * 1024 * 1024,
            screen_container: document.getElementById("screen_container"),
            
            // Uses a lightweight test Linux image to check compatibility
            cdrom: { url: "https://copy.sh" }, 
            autostart: true,
        });
    </script>
</body>
</html>
