<!DOCTYPE html>
<html>
<head>
    <title>Triage-Style Sandbox Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0c0f12;
            color: #d1d5db;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Top Navigation Header Bar */
        header {
            background-color: #161b22;
            border-bottom: 2px solid #21262d;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 14px;
            height: 14px;
            background-color: #ff5555;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff5555;
        }
        .logo-text {
            font-weight: bold;
            font-size: 18px;
            color: #f0f6fc;
            letter-spacing: 0.5px;
        }
        .badge {
            background-color: #1f6feb;
            color: #ffffff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        /* Main Screen Layout Workspace Splitter */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }
        /* Sidebar Menu Layout Panel */
        nav {
            background-color: #0d1117;
            width: 240px;
            border-right: 2px solid #21262d;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            padding: 10px 14px;
            color: #8b949e;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s ease;
            font-weight: 500;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #161b22;
            color: #58a6ff;
        }
        /* Main Central Monitor Canvas Area */
        main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        /* Dashboard Metric Widgets Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 6px;
            padding: 16px;
        }
        .card-title {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .card-value {
            font-size: 22px;
            font-weight: bold;
            color: #c9d1d9;
        }
        .risk-high {
            color: #ff5555;
        }
        /* Interactive Virtual Machine Container Frame */
        .vm-viewport-box {
            flex: 1;
            background-color: #000000;
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            min-height: 480px;
        }
        .vm-top-bar {
            background-color: #1f242c;
            border-bottom: 1px solid #30363d;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8b949e;
        }
        .vm-controls {
            display: flex;
            gap: 10px;
        }
        .vm-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .vm-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
        .vm-stream-frame {
            width: 100%;
            flex: 1;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- Header bar -->
    <header>
        <div class="logo-section">
            <div class="logo-icon"></div>
            <div class="logo-text">CUSTOM_TRIAGE</div>
            <span class="badge">SANDBOX ACTIVE</span>
        </div>
        <div style="font-size: 13px; color: #8b949e;">Session ID: <span style="color: #c9d1d9; font-family: monospace;">analysis_x86_live</span></div>
    </header>

    <!-- Content Workspace -->
    <div class="workspace">
        
        <!-- Sidebar items panel -->
        <nav>
            <div class="nav-item active">🖥️ Live Interaction</div>
            <div class="nav-item">📊 Network Analysis</div>
            <div class="nav-item">🗂️ File System Changes</div>
            <div class="nav-item">📝 Process Tree</div>
            <div class="nav-item">🛡️ MITRE ATT&CK Mapping</div>
        </nav>

        <!-- Main Display Dashboard panel layout -->
        <main>
            
            <!-- Quick Info Cards -->
            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-title">Threat Score Index</div>
                    <div class="card-value risk-high" id="live-score">0 / 10</div>
                </div>
                <div class="card">
                    <div class="card-title">VM Target Profile</div>
                    <div class="card-value" style="font-size: 16px; margin-top: 6px;">Linux x86 Desktop GUI</div>
                </div>
                <div class="card">
                    <div class="card-title">Active Connections</div>
                    <div class="card-value" id="net-count">0 Detected</div>
                </div>
            </div>

            <!-- Virtual Machine Window Frame Box -->
            <div class="vm-viewport-box">
                <div class="vm-top-bar">
                    <div>📍 Virtual Machine Stream Output Screen</div>
                    <div class="vm-controls">
                        <button class="vm-btn" onclick="triggerPanic()">Simulate Alert</button>
                        <button class="vm-btn" onclick="document.getElementById('sandbox_frame').src=document.getElementById('sandbox_frame').src;">Reset Instance</button>
                    </div>
                </div>
                
                <!-- Secure Sandbox Frame Loader Instance -->
                <iframe id="sandbox_frame" 
                        src="https://bellard.org" 
                        class="vm-stream-frame">
                </iframe>
            </div>

        </main>
    </div>

    <!-- Interface simulation features framework control script -->
    <script>
        function triggerPanic() {
            const scoreElement = document.getElementById('live-score');
            scoreElement.innerText = "8 / 10";
            scoreElement.style.color = "#ff5555";
            scoreElement.style.textShadow = "0 0 10px rgba(255,85,85,0.4)";
            
            document.getElementById('net-count').innerText = "14 outbound streams";
            document.getElementById('net-count').style.color = "#ffaa00";
            alert("Simulation Alert Triggered: Score escalated to mimic sandbox infection profile monitoring diagnostics.");
        }
    </script>

</body>
</html>
